bot:
  name: "ClinicGuru"
  farewell: "Буду рад помочь с запуском вашей клиники!"

script:
  start_node: "welcome"
  fallback_text: "Пожалуйста, выберите вариант из списка ниже."
  nodes:
    - id: "welcome"
      text: |
        Привет! Я помогу вам разобраться, как открыть и запустить медицинскую клинику под ключ.
        Выберите интересующий раздел, и я расскажу подробности.
      options:
        - label: "Услуги клиники под ключ"
          next: "services"
        - label: "Этапы запуска"
          next: "stages"
        - label: "Сроки и стоимость"
          next: "pricing"
        - label: "Оставить заявку"
          next: "lead_capture"
    - id: "services"
      text: |
        Мы закрываем полный цикл работ: анализ ниши, бизнес-план, лицензирование, подбор помещения и персонала, запуск маркетинга и операционное сопровождение.
        Выберите направление, чтобы узнать подробнее.
      options:
        - label: "Маркетинг и запуск"
          next: "marketing"
        - label: "Подбор персонала"
          next: "staffing"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "stages"
      text: |
        Проект делится на ключевые этапы: анализ и стратегия, юридическая подготовка, оснащение клиники, набор команды и маркетинговый запуск.
        Что рассказать подробнее?
      options:
        - label: "Документы и лицензии"
          next: "licensing"
        - label: "Подбор помещения"
          next: "facility"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "pricing"
      text: |
        Подготовка клиники под ключ обычно занимает от 3 до 6 месяцев. Стоимость рассчитывается индивидуально и зависит от формата, площади и специализации.
        Мы составим смету после короткого интервью.
      options:
        - label: "Рассчитать проект"
          next: "lead_capture"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "lead_capture"
      text: |
        Отлично! Чтобы подготовить персональное предложение, укажите удобный способ связи. Менеджер перезвонит в течение рабочего дня.
      options:
        - label: "Оставить номер телефона"
          next: "contact_phone"
        - label: "Оставить email"
          next: "contact_email"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "marketing"
      text: |
        Мы разработаем маркетинговую стратегию, брендбук, сайт и рекламные кампании. Поможем привлечь первых пациентов и настроим CRM с аналитикой.
      options:
        - label: "Вернуться к услугам"
          next: "services"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "staffing"
      text: |
        Набираем медицинский и административный персонал, проверяем сертификаты, организуем обучение стандартам сервиса и помощь в адаптации.
      options:
        - label: "Вернуться к услугам"
          next: "services"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "licensing"
      text: |
        Готовим пакет документов, проводим аудит помещений, взаимодействуем с Роспотребнадзором и Минздравом, получаем медицинскую лицензию "под ключ".
      options:
        - label: "Вернуться к этапам"
          next: "stages"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "facility"
      text: |
        Подбираем помещение с учётом требований СЭС, проектируем инженерные сети, организуем закупку и монтаж оборудования.
      options:
        - label: "Вернуться к этапам"
          next: "stages"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "contact_phone"
      text: |
        Напишите ваш номер в формате +7 ХХХ ХХХ-ХХ-ХХ или поделитесь контактом через Telegram. Мы позвоним, чтобы обсудить детали.
      options:
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "contact_email"
      text: |
        Укажите рабочий email, и мы отправим презентацию с расчётом и подбором оборудования.
      options:
        - label: "Вернуться в начало"
          next: "welcome"
