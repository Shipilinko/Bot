bot:
  name: "ClinicGuru"
  farewell: "Буду рад помочь с запуском вашей клиники!"
  notify_chat_ids:
    - "${TELEGRAM_MANAGER_CHAT_ID}"

script:
  start_node: "welcome"
  fallback_text: "Пожалуйста, выберите вариант из списка ниже."
  nodes:
    - id: "welcome"
      text: |
        Добро пожаловать! 👋
        Мы помогаем инвесторам и владельцам открыть стоматологическую клинику под ключ — от идеи и бизнес-плана до лицензий, оборудования и сервисного обслуживания.

        С нами вы экономите время, бюджет и избегаете типичных ошибок на старте.

        Выберите раздел, который сейчас важнее всего:
      options:
        - label: "Что такое «клиника под ключ»"
          next: "turnkey_overview"
        - label: "Как мы работаем"
          next: "workflow"
        - label: "Частые вопросы"
          next: "faq"
        - label: "Оставить заявку"
          next: "lead_capture"
    - id: "turnkey_overview"
      text: |
        Что такое клиника под ключ?
        Это не одна услуга, а полный цикл запуска клиники. Мы берём на себя:

        1️⃣ Финансовую модель и бизнес-план
        — Анализируем рынок, считаем инвестиции и окупаемость.
        — Показываем, когда и за счёт чего клиника начнёт приносить прибыль.

        2️⃣ Проектирование и планировка
        — Делаем планировку по нормам, 3D-визуализации и чертежи.
        — При необходимости подключаем проверенных строителей и ведём авторский надзор.

        3️⃣ Оснащение оборудованием
        — Подбираем оборудование под профиль клиники и бюджет.
        — Поставка, монтаж, ввод в эксплуатацию, обучение персонала.

        4️⃣ Сервис и поддержка
        — Поддержка после открытия: обслуживание оборудования, выезды инженеров.

        5️⃣ Лицензирование
        — Готовим пакет документов.
        — Сопровождаем до получения лицензий на медицинскую деятельность и рентген.

        ⚙️ В итоге вы получаете готовую к работе, лицензированную и оснащённую клинику, а не набор разрозненных подрядчиков.
      options:
        - label: "Как мы работаем"
          next: "workflow"
        - label: "Частые вопросы"
          next: "faq"
        - label: "Оставить заявку"
          next: "lead_capture"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "workflow"
      text: |
        Как мы работаем и за что отвечаем:

        🔹 Один подрядчик — весь проект.
        Вы не координируете десятки исполнителей. Мы ведём весь цикл и отвечаем за результат.

        🔹 Прозрачные сроки и бюджет.
        Составляем понятный план работ и бюджета. Предупреждаем о рисках заранее, а не по факту.

        🔹 Опыт именно в медицине.
        Учитываем санитарные нормы, требования к лицензированию и особенности стоматологии.

        🔹 Прямые контракты с производителями.
        Оборудование — от официальных поставщиков, с документами для лицензии и проверок.
      options:
        - label: "Что такое «клиника под ключ»"
          next: "turnkey_overview"
        - label: "Частые вопросы"
          next: "faq"
        - label: "Оставить заявку"
          next: "lead_capture"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "faq"
      text: |
        Частые вопросы:

        ❓ Можно подключиться только на часть пути?
        Да. Мы можем взять на себя отдельные блоки:
        — только финмодель и бизнес-план,
        — только проектирование,
        — только лицензирование,
        — только оснащение и/или сервис.
        Формат работы подбираем под ваш запрос.

        ❓ С чего начать, если у меня только идея без помещения и точных цифр?
        Начинаем с короткой консультации: обсуждаем формат клиники, город, примерный бюджет и сроки.
        После этого можем сделать базовый расчёт: диапазон инвестиций, примерный срок окупаемости и логичный первый шаг.

        ❓ Сколько времени обычно занимает запуск клиники под ключ?
        Всё зависит от помещения, объёма ремонта и скорости лицензирования.
        В среднем путь от идеи до приёма первых пациентов занимает от 4 до 9 месяцев.
        Более точный срок можно назвать после короткого брифа.
      options:
        - label: "Что такое «клиника под ключ»"
          next: "turnkey_overview"
        - label: "Как мы работаем"
          next: "workflow"
        - label: "Оставить заявку"
          next: "lead_capture"
        - label: "Вернуться в начало"
          next: "welcome"
    - id: "lead_capture"
      text: |
        Отлично, давайте сделаем первый шаг ✅

        Пожалуйста, отправьте одним сообщением:

        Город

        ФИО

        Номер телефона

        Что вас интересует?
        (например: открытие клиники с нуля, расширение, проектирование, лицензирование, оснащение и т.д.)

        Как только получим эти данные, наш специалист свяжется с вами, чтобы обсудить детали и ответить на вопросы.
      options:
        - label: "Что такое «клиника под ключ»"
          next: "turnkey_overview"
        - label: "Как мы работаем"
          next: "workflow"
        - label: "Частые вопросы"
          next: "faq"
        - label: "Вернуться в начало"
          next: "welcome"
      capture:
        type: "lead_form"
        next_node: "welcome"
